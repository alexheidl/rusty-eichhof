[package]
name = "last-eichhof"
version = "1.2.0"
edition = "2021"
license = "MIT"

[features]
# Builds the original freeware game's BEER.DAT into the program (the default; releases use it).
# With --no-default-features the program reads BEER.DAT from beside it instead.
default = ["embedded"]
embedded = []

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Android: reads the app's private folder (where settings and high scores are saved) through JNI.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.2"

[package.metadata.android]
package_name = "rs.lasteichhof.game"
label = "The Last Eichhof"
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
