<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Last Eichhof</title>
<style>
  html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    position: absolute; background: black; z-index: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js"></script>
<script>
// Keeps the game's CONFIG.HIG (keys, sound, high scores) in this browser's localStorage.
miniquad_add_plugin({
  name: "eich_storage",
  version: 1,
  register_plugin: function (importObject) {
    var KEY = "last-eichhof/CONFIG.HIG";
    importObject.env.eich_config_store = function (ptr, len) {
      try {
        var bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
        var s = "";
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        localStorage.setItem(KEY, btoa(s));
      } catch (e) { console.warn("could not save settings", e); }
    };
    importObject.env.eich_config_load = function (ptr, max) {
      try {
        var v = localStorage.getItem(KEY);
        if (!v) return 0;
        var s = atob(v);
        var n = Math.min(s.length, max);
        var dest = new Uint8Array(wasm_memory.buffer, ptr, n);
        for (var i = 0; i < n; i++) dest[i] = s.charCodeAt(i);
        return n;
      } catch (e) { return 0; }
    };
  }
});
load("last-eichhof.wasm");
</script>
</body>
</html>
